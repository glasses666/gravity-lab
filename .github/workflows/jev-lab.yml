name: Jev Lab

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.jev/request.json'
      - '.github/workflows/jev-lab.yml'

permissions:
  contents: read

jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .jev/request.json
          jq -e '
            (.model | type == "string") and
            (.questions | type == "object" and length > 0) and
            has("state")
          ' .jev/request.json >/dev/null

      - name: Call Jev
        shell: bash
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -Eeuo pipefail

          if [ -z "${TYPESAFE_API_KEY:-}" ]; then
            echo "::error::TYPESAFE_API_KEY secret is missing"
            exit 2
          fi

          START_NS="$(date +%s%N)"
          METRICS="$(curl -sS \
            --connect-timeout 5 \
            --max-time 30 \
            -o /tmp/jev-response.json \
            -w '%{http_code} %{time_total}' \
            -X POST https://api.typesafe.ai/v1/systemone \
            -H "Authorization: Bearer $TYPESAFE_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @.jev/request.json)"
          END_NS="$(date +%s%N)"

          read -r HTTP_CODE CURL_SECONDS <<< "$METRICS"
          WALL_MS=$(( (END_NS - START_NS) / 1000000 ))

          echo "HTTP $HTTP_CODE"
          echo "curl_total=${CURL_SECONDS}s"
          echo "wall_ms=${WALL_MS}"
          jq . /tmp/jev-response.json

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

          MODEL="$(jq -r '.model' /tmp/jev-response.json)"
          INPUT_TOKENS="$(jq -r '.usage.input_tokens' /tmp/jev-response.json)"
          OUTPUT_TOKENS="$(jq -r '.usage.output_tokens' /tmp/jev-response.json)"

          {
            echo '## Jev Lab'
            echo
            echo "- Model: $MODEL"
            echo "- Input tokens: $INPUT_TOKENS"
            echo "- Output tokens: $OUTPUT_TOKENS"
            echo "- API time: ${CURL_SECONDS}s"
            echo "- Wall time: ${WALL_MS} ms"
            echo
            echo '### Answers'
            echo
            jq '.answers' /tmp/jev-response.json
          } >> "$GITHUB_STEP_SUMMARY"