name: Jev Public API Probe

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/jev-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TypeSafe docs and unauthenticated Jev API
        shell: bash
        run: |
          set -u
          echo '=== docs index ==='
          curl -fsSL --connect-timeout 5 --max-time 20 https://docs.typesafe.ai/llms.txt -o /tmp/llms.txt
          grep -Ei 'API|JavaScript|models|pricing|credit|billing|keys' /tmp/llms.txt | head -30 || true

          echo '=== API without Authorization header ==='
          code="$(curl -sS --connect-timeout 5 --max-time 20             -o /tmp/no-key-body.txt -w '%{http_code}'             -X POST https://api.typesafe.ai/v1/systemone             -H 'Content-Type: application/json'             --data-binary @- <<'JSON'
          {"model":"jev-latest","state":{"text":"A user says: please remind me tomorrow morning"},"questions":{"kind":{"type":"choice","instructions":"What kind of request is this?","criteria":{"reminder":"The user wants a reminder or scheduled follow-up.","other":"The user wants something else."}}}}
          JSON
          )"
          echo "no_key_http=$code"
          echo -n 'no_key_body='
          head -c 500 /tmp/no-key-body.txt | tr '\n' ' '
          echo

          echo '=== API with deliberately invalid key ==='
          code2="$(curl -sS --connect-timeout 5 --max-time 20             -o /tmp/bad-key-body.txt -w '%{http_code}'             -X POST https://api.typesafe.ai/v1/systemone             -H 'Authorization: Bearer definitely-not-a-real-key'             -H 'Content-Type: application/json'             --data-binary @- <<'JSON'
          {"model":"jev-latest","state":{"text":"hello"},"questions":{"kind":{"type":"choice","instructions":"Pick the best label.","criteria":{"hello":"This is a greeting.","other":"This is not a greeting."}}}}
          JSON
          )"
          echo "bad_key_http=$code2"
          echo -n 'bad_key_body='
          head -c 500 /tmp/bad-key-body.txt | tr '\n' ' '
          echo

          echo '=== public service reachability ==='
          curl -sS -o /dev/null -w 'api_root_http=%{http_code} total=%{time_total}s\n' --connect-timeout 5 --max-time 20 https://api.typesafe.ai/
          curl -sS -o /dev/null -w 'console_http=%{http_code} total=%{time_total}s\n' --connect-timeout 5 --max-time 20 https://console.typesafe.ai/
